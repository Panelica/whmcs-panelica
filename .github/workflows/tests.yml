name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Offline suite (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit

  syntax:
    # The module itself supports PHP 7.4 and later; PHPUnit does not, so the
    # older versions are checked for syntax rather than run.
    name: Module syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: |
          for f in modules/servers/panelica/panelica.php modules/servers/panelica/lib/PanelicaAPI.php; do
            php -l "$f"
          done
